<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>HOLO BLACK VIP | Get Key</title>
  <style>
    * { box-sizing: border-box; }
    :root { --bg:#080808; --panel:#111; --line:#292929; --text:#f5f5f5; --muted:#9b9b9b; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      color:var(--text); font-family:Arial, Helvetica, sans-serif;
      background:radial-gradient(ellipse at 50% 0%, #242424 0%, #101010 35%, #070707 75%);
    }
    .card {
      width:min(100%, 420px); padding:34px 26px 28px; text-align:center;
      background:linear-gradient(160deg,#171717,#0c0c0c 65%);
      border:1px solid #333; border-radius:22px;
      box-shadow:0 22px 70px #000b,inset 0 1px 0 #ffffff12;
    }
    .logo {
      width:76px;height:76px;margin:0 auto 18px;display:grid;place-items:center;
      border:1px solid #777;border-radius:20px;background:#080808;
      box-shadow:0 0 28px #ffffff12;font-size:26px;font-weight:900;letter-spacing:-2px;
    }
    .eyebrow{color:#aaa;font-size:11px;letter-spacing:4px;margin:0 0 9px}
    h1{font-size:27px;letter-spacing:2px;margin:0;font-weight:900}
    h1 span{color:#888}
    .subtitle{color:var(--muted);font-size:13px;line-height:1.6;margin:13px 0 25px}
    .status{
      display:inline-flex;align-items:center;gap:8px;padding:8px 12px;
      border:1px solid #303030;border-radius:30px;color:#cfcfcf;
      font-size:11px;letter-spacing:1px;margin-bottom:22px
    }
    .dot{width:7px;height:7px;border-radius:50%;background:#e7e7e7;box-shadow:0 0 9px #fff}
    .button{
      width:100%;border:0;border-radius:12px;padding:16px 18px;color:#080808;
      background:linear-gradient(110deg,#fff,#c9c9c9);font-size:14px;
      font-weight:900;letter-spacing:2px;cursor:pointer;transition:.18s;
      box-shadow:0 8px 25px #fff2
    }
    .button:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .button:disabled{opacity:.6;cursor:wait;transform:none}
    .result{
      display:none;margin-top:20px;padding:16px;border:1px solid #393939;
      border-radius:12px;background:#090909;text-align:left
    }
    .result.show{display:block}
    .result-label{color:#999;font-size:10px;letter-spacing:2px;margin-bottom:10px}
    .key-row{display:flex;align-items:center;gap:8px}
    #key{flex:1;min-width:0;overflow-wrap:anywhere;color:#fff;font-family:monospace;font-size:13px}
    .countdown{margin-top:13px;padding:10px;border:1px solid #303030;border-radius:9px;background:#111;color:#d8d8d8;font-size:11px;letter-spacing:1px;text-align:center}
    .countdown strong{display:block;margin-top:4px;color:#fff;font-family:monospace;font-size:18px;letter-spacing:2px}
    .countdown.expired{border-color:#6b3030;color:#ff9999}
    .countdown.expired strong{color:#ff7777}
    .copy{
      flex-shrink:0;padding:9px 11px;color:#fff;background:#252525;
      border:1px solid #444;border-radius:8px;cursor:pointer;font-size:11px
    }
    .message{min-height:18px;color:#aaa;font-size:12px;line-height:1.5;margin:14px 0 0}
    .message.error{color:#ff7777}.message.success{color:#9ee6bd}
    .note{color:#777;font-size:10px;line-height:1.5;margin:22px 0 0}
    footer{margin-top:22px;color:#555;font-size:10px;letter-spacing:1.5px}
    @media(max-width:360px){.card{padding:28px 19px 23px}h1{font-size:23px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">HB</div>
    <p class="eyebrow">WELCOME TO</p>
    <h1>HOLO BLACK <span>VIP</span></h1>
    <p class="subtitle">Portal oficial de acceso.<br>Presiona el botón para obtener tu clave.</p>
    <div class="status"><span class="dot"></span> SISTEMA DISPONIBLE</div>
    <button class="button" id="generate" type="button">GENERAR KEY</button>

    <section class="result" id="result" aria-live="polite">
      <div class="result-label">TU KEY</div>
      <div class="key-row">
        <code id="key"></code>
        <button class="copy" id="copy" type="button">COPIAR</button>
      </div>
      <div class="countdown" id="countdown" hidden>
        TIEMPO RESTANTE
        <strong id="countdown-value">06:00:00</strong>
      </div>
    </section>
    <p class="message" id="message" role="status"></p>
    <p class="note">Cada clave tiene un límite de 1 dispositivo y una duración de 6 horas.</p>
    <footer>© 2026 HOLO BLACK VIP</footer>
  </main>

  <script>
    const FIREBASE_URL = 'https://holo-venta-default-rtdb.firebaseio.com';
    const KEYS_PATH = 'holo_vipffree2_Security/Keys';

    const generateButton = document.getElementById('generate');
    const result = document.getElementById('result');
    const keyOutput = document.getElementById('key');
    const copyButton = document.getElementById('copy');
    const message = document.getElementById('message');
    const countdown = document.getElementById('countdown');
    const countdownValue = document.getElementById('countdown-value');
    const ACTIVE_KEY_STORAGE = 'holoBlackActiveKey';
    const STATUS_CHECK_INTERVAL = 15000;
    let countdownInterval = null;
    let statusCheckInterval = null;

    function createKey() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const bytes = new Uint8Array(6);
      crypto.getRandomValues(bytes);
      let value = '';
      for (const byte of bytes) value += chars[byte % chars.length];
      return 'VIP-' + value;
    }

    function expiryIn6Hours() {
      return new Date(Date.now() + 6 * 60 * 60 * 1000).toISOString();
    }

    function startCountdown(expiry) {
      clearInterval(countdownInterval);
      countdown.hidden = false;
      countdown.classList.remove('expired');
      const labelNode = countdown.firstChild;

      const update = () => {
        const remaining = Math.max(0, new Date(expiry).getTime() - Date.now());
        const totalSeconds = Math.floor(remaining / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        countdownValue.textContent = `${hours}:${minutes}:${seconds}`;

        if (remaining <= 0) {
          labelNode.textContent = ' KEY EXPIRADA';
          countdown.classList.add('expired');
          clearInterval(countdownInterval);
          localStorage.removeItem(ACTIVE_KEY_STORAGE);
          generateButton.disabled = false;
          generateButton.style.display = '';
          generateButton.textContent = 'GENERAR KEY';
          message.className = 'message success';
          message.textContent = 'La key expiró. Ya puedes generar otra.';
        }
      };

      update();
      countdownInterval = setInterval(update, 1000);
    }

    function restoreActiveKey() {
      try {
        const active = JSON.parse(localStorage.getItem(ACTIVE_KEY_STORAGE) || 'null');
        if (!active || !active.key || !active.expiry || new Date(active.expiry).getTime() <= Date.now()) {
          localStorage.removeItem(ACTIVE_KEY_STORAGE);
          return;
        }

        keyOutput.textContent = active.key;
        result.classList.add('show');
        startCountdown(active.expiry);
        generateButton.disabled = true;
        generateButton.style.display = 'none';
        message.className = 'message';
        message.textContent = '';
      } catch {
        localStorage.removeItem(ACTIVE_KEY_STORAGE);
      }
    }

    function unlockGenerator(reason = '') {
      clearInterval(countdownInterval);
      localStorage.removeItem(ACTIVE_KEY_STORAGE);
      countdown.hidden = true;
      result.classList.remove('show');
      keyOutput.textContent = '';
      generateButton.disabled = false;
      generateButton.style.display = '';
      generateButton.textContent = 'GENERAR KEY';
      message.className = reason ? 'message success' : 'message';
      message.textContent = reason;
    }

    async function checkActiveKeyStatus() {
      let active;
      try {
        active = JSON.parse(localStorage.getItem(ACTIVE_KEY_STORAGE) || 'null');
      } catch {
        unlockGenerator('La key ya no está activa.');
        return;
      }

      if (!active || !active.key) return;

      const keyUrl = `${FIREBASE_URL}/${KEYS_PATH}/${encodeURIComponent(active.key)}.json`;
      try {
        const response = await fetch(keyUrl, { cache: 'no-store' });
        if (!response.ok) return;
        const record = await response.json();

        // null = key eliminada desde el panel.
        if (record === null) {
          unlockGenerator('La key fue eliminada. Ya puedes generar otra.');
          return;
        }

        const expiry = record.ExpiryTimestamp || Date.parse(record.ExpiryDate);
        const isExpired = Number.isFinite(expiry) && expiry <= Date.now();
        const isBlocked = record.Banned === true || String(record.Status || '').toLowerCase() === 'banned';
        const isReset = record.Reset === true || record.ForceReset === true || record.ResetAt;

        if (isExpired || isBlocked || isReset) {
          unlockGenerator('La key ya no está activa. Ya puedes generar otra.');
        }
      } catch (error) {
        console.warn('No se pudo consultar el estado de la key.', error);
      }
    }

    function getDeviceId() {
      let deviceId = localStorage.getItem('holoBlackDeviceId');
      if (!deviceId) {
        deviceId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem('holoBlackDeviceId', deviceId);
      }
      return deviceId;
    }

    function getBrowserName() {
      const ua = navigator.userAgent;
      if (/Edg\//.test(ua)) return 'Microsoft Edge';
      if (/OPR\//.test(ua)) return 'Opera';
      if (/Chrome\//.test(ua)) return 'Google Chrome';
      if (/Firefox\//.test(ua)) return 'Mozilla Firefox';
      if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return 'Safari';
      return 'Navegador desconocido';
    }

    async function getPublicIp() {
      try {
        const response = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
        if (!response.ok) return 'Sin registrar';
        const data = await response.json();
        return data.ip || 'Sin registrar';
      } catch {
        return 'Sin registrar';
      }
    }

    async function getClientMetadata() {
      return { ip: await getPublicIp(), deviceId: getDeviceId() };
    }

    async function findActiveLock(metadata) {
      const response = await fetch(`${FIREBASE_URL}/${KEYS_PATH}.json`, { cache: 'no-store' });
      if (!response.ok) throw new Error('No se pudo comprobar si ya existe una key activa.');
      const keys = await response.json() || {};
      const now = Date.now();

      return Object.values(keys).some(record => {
        if (!record || record.Banned === true || record.Status === 'banned') return false;
        const expiry = Number(record.ExpiryTimestamp) || Date.parse(record.ExpiryDate);
        if (!Number.isFinite(expiry) || expiry <= now) return false;
        const storedIp = record.IP || record.ip || record.Ip || record.ipAddress;
        const storedDevice = record.DeviceId || record.deviceId || record.IDDispositivo || record.idDispositivo;
        return (metadata.ip !== 'Sin registrar' && storedIp === metadata.ip) ||
          (storedDevice && storedDevice === metadata.deviceId);
      });
    }

    async function saveKeyToFirebase(key, metadata) {
      const keyUrl = `${FIREBASE_URL}/${KEYS_PATH}/${encodeURIComponent(key)}.json`;
      const check = await fetch(keyUrl);
      if (!check.ok) throw new Error('No se pudo comprobar si la KEY ya existe. Inténtalo de nuevo.');
      const existing = await check.json();
      if (existing !== null) return { saved: false };

      const expiry = expiryIn6Hours();
      const record = {
        Username: 'HOLO BLACK VIP',
        DeviceLimit: 1,
        ExpiryDate: expiry,
        ExpiryTimestamp: new Date(expiry).getTime(),
        Devices: { dummy: 0 },
        Banned: false,
        CreatedAt: new Date().toISOString(),
        IP: metadata.ip,
        DeviceId: metadata.deviceId,
        Navegador: getBrowserName(),
        CreatedFrom: 'generator',
        Origen: 'generator'
      };

      const response = await fetch(keyUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(record)
      });

      if (!response.ok) {
        const detail = await response.text();
        throw new Error('No se pudo guardar la KEY. Inténtalo de nuevo. ' + detail);
      }
      return { saved: true, expiry };
    }

    generateButton.addEventListener('click', async () => {
      generateButton.disabled = true;
      generateButton.textContent = 'GUARDANDO KEY...';
      message.className = 'message';
      message.textContent = 'Preparando tu KEY…';
      result.classList.remove('show');

      try {
        const metadata = await getClientMetadata();
        if (await findActiveLock(metadata)) {
          throw new Error('Ya existe una key activa para esta IP o dispositivo.');
        }

        let key;
        let saved = false;
        let expiry;

        for (let attempt = 0; attempt < 5 && !saved; attempt++) {
          key = createKey();
          const outcome = await saveKeyToFirebase(key, metadata);
          saved = outcome.saved;
          expiry = outcome.expiry;
        }
        if (!saved) throw new Error('No se pudo generar una KEY única. Inténtalo de nuevo.');

        keyOutput.textContent = key;
        localStorage.setItem(ACTIVE_KEY_STORAGE, JSON.stringify({ key, expiry }));
        startCountdown(expiry);
        result.classList.add('show');
        message.className = 'message success';
        message.textContent = '¡KEY generada correctamente!';
        generateButton.disabled = true;
        generateButton.style.display = 'none';
      } catch (error) {
        console.error(error);
        message.className = 'message error';
        message.textContent = error.message || 'Ocurrió un error al guardar la KEY.';
        generateButton.textContent = 'INTENTAR DE NUEVO';
      } finally {
        if (!localStorage.getItem(ACTIVE_KEY_STORAGE)) {
          generateButton.disabled = false;
        }
      }
    });

    copyButton.addEventListener('click', async () => {
      const value = keyOutput.textContent;
      try {
        await navigator.clipboard.writeText(value);
        copyButton.textContent = 'COPIADA';
      } catch {
        const range = document.createRange();
        range.selectNodeContents(keyOutput);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        copyButton.textContent = 'SELECCIONADA';
      }
      setTimeout(() => copyButton.textContent = 'COPIAR', 1600);
    });

    restoreActiveKey();
    checkActiveKeyStatus();
    statusCheckInterval = setInterval(checkActiveKeyStatus, STATUS_CHECK_INTERVAL);
  </script>
</body>
</html>
