<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Acceso desbloqueado | HOLO BLACK VIP</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 0%,#242424 0%,#101010 35%,#070707 75%)}
    .card{width:min(100%,420px);padding:34px 26px 30px;text-align:center;background:linear-gradient(160deg,#171717,#0c0c0c 65%);border:1px solid #333;border-radius:22px;box-shadow:0 22px 70px #000b,inset 0 1px 0 #ffffff12}
    .icon{width:74px;height:74px;margin:0 auto 20px;display:grid;place-items:center;border:1px solid #9ee6bd;border-radius:50%;color:#9ee6bd;font-size:34px;box-shadow:0 0 28px #9ee6bd25}
    .eyebrow{color:#aaa;font-size:11px;letter-spacing:3px;margin:0 0 10px}
    h1{font-size:25px;letter-spacing:1px;margin:0;font-weight:900}
    p{color:#aaa;font-size:13px;line-height:1.6;margin:14px 0 24px}
    .button{display:inline-block;width:100%;border:0;border-radius:12px;padding:16px 18px;color:#080808;background:linear-gradient(110deg,#fff,#c9c9c9);font-size:14px;font-weight:900;letter-spacing:1px;text-decoration:none;cursor:pointer}
    .small{margin:16px 0 0;color:#666;font-size:10px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <p class="eyebrow">LINKVERTISE</p>
    <h1>ACCESO DESBLOQUEADO</h1>
    <p>El acceso fue completado correctamente. Pulsa el botón para continuar.</p>
    <a class="button" href="index.html?unlocked=1">CONTINUAR AL GENERADOR</a>
    <p class="small">Pulsa el botón cuando estés listo para continuar.</p>
  </main>
  <script>
    // Guarda el acceso temporalmente en este navegador.
    const unlockedAt = Date.now();
    localStorage.setItem('linkvertiseUnlockedAt', String(unlockedAt));
    localStorage.setItem(
      'linkvertiseUnlockedUntil',
      String(unlockedAt + 30 * 60 * 1000)
    );
    localStorage.setItem(
      'holoBlackLinkvertiseUnlockedUntil',
      String(unlockedAt + 30 * 60 * 1000)
    );
  </script>
</body>
</html>
